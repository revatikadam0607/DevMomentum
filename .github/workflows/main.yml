name: OSCI Issue Automation

on:
  issues:
    types:
      - assigned

  schedule:
    # Runs once every day.
    # GitHub Actions scheduled jobs may run with some delay.
    - cron: "30 0 * * *"

permissions:
  issues: write
  contents: read
  pull-requests: read

jobs:

  # ============================================================
  # 1. MESSAGE WHEN SOMEONE IS ASSIGNED
  # ============================================================

  assignment-message:
    if: github.event_name == 'issues' && github.event.action == 'assigned'

    runs-on: ubuntu-latest

    steps:
      - name: Thank contributor
        uses: actions/github-script@v7

        with:
          script: |

            const issue = context.payload.issue;
            const assignee = context.payload.assignee;

            if (!assignee) {
              return;
            }

            const marker = '<!-- osci-assignment-message -->';

            const comments = await github.paginate(
              github.rest.issues.listComments,
              {
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                per_page: 100
              }
            );

            // Prevent duplicate assignment messages
            const alreadySent = comments.some(comment =>
              comment.body.includes(marker) &&
              comment.body.includes(`@${assignee.login}`)
            );

            if (alreadySent) {
              return;
            }

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issue.number,
              body: `${marker}

              Thanks @${assignee.login} for taking up this issue! 🎉

              You may proceed with the implementation. Please make sure to follow the project's contribution guidelines and keep the changes focused on this issue.`
            });


              if (contributorCommented) {
                hasMeaningfulActivity = true;
                console.log(
                  `Contributor commented on #${issue.number}`
                );
              }


              // ------------------------------------------------
              // 2. Contributor created/reopened activity
              // ------------------------------------------------

              const contributorTimelineActivity =
                timeline.some(event => {

                  const eventDate =
                    new Date(event.created_at);

                  return (
                    eventDate > assignedAt &&
                    event.actor &&
                    event.actor.login === assignee.login
                  );
                });


              if (contributorTimelineActivity) {
                hasMeaningfulActivity = true;
                console.log(
                  `Contributor has timeline activity on #${issue.number}`
                );
              }


              // =================================================
              // CHECK LINKED PULL REQUESTS
              // =================================================

              const linkedPullRequests =
                await github.paginate(
                  github.rest.search.issuesAndPullRequests,
                  {
                    q:
                      `repo:${context.repo.owner}/${context.repo.repo} ` +
                      `is:pr is:open ` +
                      `"${issue.number}"`,
                    per_page: 100
                  }
                );


              const contributorPR =
                linkedPullRequests.some(pr => {

                  if (!pr.user) {
                    return false;
                  }

                  return (
                    pr.user.login === assignee.login &&
                    new Date(pr.created_at) > assignedAt
                  );
                });


              if (contributorPR) {
                hasMeaningfulActivity = true;

                console.log(
                  `Contributor has an open PR for #${issue.number}`
                );
              }


              // =================================================
              // 3-DAY REMINDER
              // =================================================

              if (
                daysAssigned >= 3 &&
                daysAssigned < 5 &&
                !hasMeaningfulActivity
              ) {

                const marker =
                  '<!-- osci-3-day-reminder -->';

                const alreadyReminded =
                  comments.some(comment =>
                    comment.body.includes(marker)
                  );


                if (!alreadyReminded) {

                  await github.rest.issues.createComment({

                    owner: context.repo.owner,
                    repo: context.repo.repo,

                    issue_number: issue.number,

                    body: `${marker}

                    Hi @${assignee.login}, just a quick reminder that this issue has been assigned to you for 3 days.

                    Please share an update on your progress when possible. If you are facing any difficulty, feel free to mention it here so the maintainers can help.`
                  });

                  console.log(
                    `3-day reminder sent for #${issue.number}`
                  );
                }
              }


              // =================================================
              // 5-DAY CHECK
              // =================================================

              if (daysAssigned >= 5) {


                // ----------------------------------------------
                // Contributor is active
                // ----------------------------------------------

                if (hasMeaningfulActivity) {

                  console.log(
                    `Issue #${issue.number} has activity. Keeping assignment.`
                  );

                  continue;
                }


                // ----------------------------------------------
                // Contributor is inactive
                // ----------------------------------------------

                const marker =
                  '<!-- osci-5-day-unassignment -->';


                const alreadyProcessed =
                  comments.some(comment =>
                    comment.body.includes(marker)
                  );


                if (alreadyProcessed) {
                  continue;
                }


                // ----------------------------------------------
                // Remove assignee
                // ----------------------------------------------

                await github.rest.issues.removeAssignees({

                  owner: context.repo.owner,
                  repo: context.repo.repo,

                  issue_number: issue.number,

                  assignees: [
                    assignee.login
                  ]
                });


                // ----------------------------------------------
                // Add available label
                // ----------------------------------------------

                try {

                  await github.rest.issues.addLabels({

                    owner: context.repo.owner,
                    repo: context.repo.repo,

                    issue_number: issue.number,

                    labels: [
                      'available'
                    ]
                  });

                } catch (error) {

                  console.log(
                    'Could not add available label. ' +
                    'Make sure the label exists.'
                  );

                }


                // ----------------------------------------------
                // Notify contributor
                // ----------------------------------------------

                await github.rest.issues.createComment({

                  owner: context.repo.owner,
                  repo: context.repo.repo,

                  issue_number: issue.number,

                  body: `${marker}

                  Hi @${assignee.login}, this issue has been assigned to you for 5 days without any visible progress or update.

                  To give other contributors an opportunity to work on the issue, it has now been opened for other contributors.

                  Thank you for your interest and contribution! 🙌`
                });


                console.log(
                  `Issue #${issue.number} released for other contributors`
                );
              }
            }
